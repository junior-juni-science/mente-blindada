<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Conectado - Mente Blindada Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0f19;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
        }
        .card {
            background: #1e293b;
            border-radius: 20px;
            padding: 3rem 2rem;
            text-align: center;
            max-width: 520px;
            width: 100%;
            border: 1px solid rgba(16, 185, 129, 0.3);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        .icon {
            width: 72px;
            height: 72px;
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.25rem;
            margin: 0 auto 1.5rem;
            border: 2px solid #10b981;
        }
        h1 {
            font-size: 1.75rem;
            margin-bottom: 0.75rem;
            color: #ffffff;
        }
        p {
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 1.5rem;
            font-size: 1rem;
        }
        .code-box {
            background: #0f172a;
            padding: 0.85rem;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-family: monospace;
            font-size: 0.85rem;
            color: #38bdf8;
            word-break: break-all;
            margin-bottom: 1.5rem;
            display: none;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            padding: 0.75rem 1.75rem;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">✓</div>
        <h1>Finalizando conexão...</h1>
        <p>Enviando a autorização do <strong>TikTok</strong> para o <strong>Mente Blindada Studio</strong> aberto no seu computador.</p>
        <div id="codeBox" class="code-box"></div>
        <a id="localLink" class="btn" href="http://localhost:8000/">Concluir no Estúdio</a>
    </div>

    <script>
        // O app local troca o código pelo token. O redirect_uri registrado no TikTok é esta página,
        // então ela repassa o code (ou o erro) para o backend em localhost.
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const error = urlParams.get('error');
        // O state é o código de segurança que o app gerou ao abrir a autorização
        const state = urlParams.get('state');
        if (code || error) {
            const forward = new URLSearchParams();
            if (code) forward.set('code', code);
            if (error) forward.set('error', error);
            if (state) forward.set('state', state);
            const localUrl = 'http://localhost:8000/api/tiktok/callback?' + forward.toString();
            document.getElementById('localLink').href = localUrl;
            const box = document.getElementById('codeBox');
            box.style.display = 'block';
            box.textContent = 'Se não for redirecionado, verifique se o app está aberto e clique no botão abaixo.';
            window.location.replace(localUrl);
        }
    </script>
</body>
</html>
